# What to watch. See README.md for the full field reference.
#
# Location selectors are mutually exclusive: a watch uses exactly one of
# `stores`, `cities` or `emirates`.
#
#   cities:   [Abu Dhabi]  ->  R706 Al Maryah Island, R595 Yas Mall
#   emirates: [Abu Dhabi]  ->  the above plus R785 Al Jimi Mall (city Al Ain)
#   stores:   [R706]       ->  exactly what you list
#
# Validate any change before committing it:  python -m applewatch --dry-run

ntfy_topic_env: NTFY_TOPIC
poll_location: Abu Dhabi
reminder_minutes: 30

watches:
  # These two watches OVERLAP on burgundy, deliberately.
  #
  # When several watches cover the same (sku, store) pair, exactly one alert
  # fires and it carries the HIGHEST priority among them. So burgundy matches
  # both rules below and alerts at `urgent`, while the other finishes match
  # only the second and alert at `default`. One glance at the lock screen
  # tells you which one it is.
  #
  # The second rule omits `color` rather than listing three finishes, so any
  # finish Apple adds later is picked up automatically, at `default`.

  - name: "Burgundy 512GB Pro Max, Abu Dhabi city"
    model: iphone18promax
    capacity: [512gb]
    color: [burgundy]
    cities: [Abu Dhabi]
    priority: urgent

  - name: "Any other 512GB Pro Max finish, Abu Dhabi city"
    model: iphone18promax
    capacity: [512gb]
    cities: [Abu Dhabi]
    priority: default

  # To also cover Al Jimi Mall in Al Ain (133 km, Abu Dhabi emirate), replace
  # BOTH `cities` lines above with:
  #     emirates: [Abu Dhabi]
  # Replace it rather than adding a second `cities` watch. (Overlapping watches
  # are fine when tiering priority, as above, but redundant for reach.)
